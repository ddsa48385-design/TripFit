<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Bricolage+Grotesque:wght@300;800&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f3f9ff;--card:#fff;--ink:#16304f;--mut:#6a7f99;--line:#dbe8f7;--pri:#2e7dff;--priInk:#fff;--sun:#ffc938;--pink:#ff6f91;--mint:#2ed3a5;--soft:#e6f1ff;--sh:#1c5bd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1829;--card:#15243a;--ink:#eaf2ff;--mut:#9fb3cf;--line:#26395a;--soft:#1b2f4d;--sh:#1647a8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1829;--card:#15243a;--ink:#eaf2ff;--mut:#9fb3cf;--line:#26395a;--soft:#1b2f4d;--sh:#1647a8}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans Thai",system-ui,sans-serif}
h1,h2,h3,.logo,.btn,.price{font-family:'IBM Plex Sans Thai',"Noto Sans Thai",sans-serif}h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.bar{max-width:1120px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:700;color:var(--pri);cursor:pointer}.logo b{background:var(--sun);color:#3a2b00;border-radius:10px;padding:0 8px;margin-left:2px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:99px;color:var(--mut);font-weight:500}
nav button.on{background:var(--pri);color:var(--priInk)}
.btn{border:0;border-radius:99px;padding:10px 20px;font-weight:600;background:var(--pri);color:var(--priInk);box-shadow:0 4px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.btn.sun{background:var(--sun);color:#3a2b00;box-shadow:0 4px 0 #d99f00}.btn.pink{background:var(--pink);box-shadow:0 4px 0 #cf4468}
.btn.out{background:var(--card);color:var(--pri);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{opacity:.5}
main{max-width:1120px;margin:auto;padding:8px 16px 110px}
.hero{border-radius:32px;padding:38px 30px;color:#fff;background:radial-gradient(circle at 90% 10%,var(--sun) 0 70px,transparent 71px),radial-gradient(circle at 80% 100%,var(--pink) 0 110px,transparent 111px),var(--pri);position:relative;overflow:hidden}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.25;max-width:12em}.hero p{max-width:30em;margin:10px 0 18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.step{background:var(--card);border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;border:2px solid var(--line)}
.step i{font-style:normal;font-size:30px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.step b{display:block;font-family:'IBM Plex Sans Thai'}.step span{color:var(--mut);font-size:13px}
.search{display:flex;gap:8px;max-width:520px}.search input{flex:1;border:0;border-radius:99px;padding:12px 18px;color:#16304f;background:#fff}
.cats{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 14px}
.chip{white-space:nowrap;border:2px solid var(--line);background:var(--card);padding:6px 16px;border-radius:99px;font-weight:500}
.chip.on{background:var(--sun);border-color:var(--sun);color:#3a2b00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-4px);border-color:var(--pri)}
.thumb{height:150px;display:grid;place-items:center;font-size:56px;background-size:cover;background-position:center}
.cb{padding:14px}.cb h3{font-size:15px;line-height:1.4;height:42px;overflow:hidden}
.who{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;margin-top:8px}
.av{width:28px;height:28px;border-radius:50%;background:var(--pink) center/cover;color:#fff;display:grid;place-items:center;font:600 13px 'IBM Plex Sans Thai';flex:none}
.av.l{width:84px;height:84px;font-size:32px}
.price{font-weight:700;color:var(--pri);font-size:18px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--pri);font-weight:500}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}

.up{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;color:var(--mut);cursor:pointer;background-size:cover;background-position:center}

.sbox{position:relative;max-width:640px;margin:auto;text-align:left}

.sg{display:none;position:absolute;left:12px;right:12px;top:calc(100% + 6px);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.2);padding:6px;z-index:12;overflow:hidden}
.sbox:focus-within .sg{display:block}.sg button{display:flex;width:100%;gap:8px;border:0;background:none;padding:10px 14px;border-radius:12px;text-align:left}.sg button:hover{background:var(--soft)}.sg small{margin-left:auto;color:var(--pri);font-weight:600}
.ed{outline:2px dashed var(--pri);outline-offset:3px;border-radius:8px;position:relative;cursor:pointer}
.ed::after{content:"✎";position:absolute;top:-12px;right:-8px;background:var(--pri);color:#fff;font-size:11px;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.bns{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px}
.bn{flex:0 0 min(420px,86%);height:150px;border-radius:24px;padding:20px;color:#fff;display:flex;align-items:flex-end;scroll-snap-align:start;position:relative;cursor:pointer}
.bn b{font:700 22px/1.2 'IBM Plex Sans Thai';display:block;text-shadow:0 2px 8px rgba(0,0,0,.3)}.bn span{font-size:14px;opacity:.95}.bn:hover{transform:translateY(-5px) scale(1.02)}
.bn.add{background:var(--soft);color:var(--pri);justify-content:center;align-items:center;border:2px dashed var(--pri);font-weight:600}
.xb{position:absolute;top:10px;right:10px;border:0;border-radius:50%;width:30px;height:30px;background:#fff;color:#cf4468}
.crow{display:flex;gap:6px;overflow-x:auto;padding:10px 4px 14px}
.ct{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px;padding:8px 6px;border-bottom:3px solid transparent;font-size:13px;font-weight:500}
.ct:hover{transform:translateY(-5px)}.ct.on{border-color:var(--pri);color:var(--pri)}
.ci{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;background-size:cover;background-position:center;box-shadow:0 6px 14px rgba(30,80,170,.15)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:6px 0 22px}
.tile{height:84px;border-radius:16px;padding:14px;color:#fff;display:flex;gap:10px;align-items:flex-end;font:600 17px 'IBM Plex Sans Thai';cursor:pointer;position:relative}
.tile:hover{transform:translateY(-5px) scale(1.03)}
.sw{display:flex;gap:10px;align-items:center;margin:6px 0;font-size:15px;color:var(--ink)}.sw input{width:auto}
.lock{text-align:center;padding:90px 10px}
@media(prefers-reduced-motion:reduce){.cur b{transition:none}.ty b::after{animation:none}}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#192320;--ink:#ecefe9;--mut:#9aa89f;--line:#2b3a33;--soft:#22302a;--pri:#3fb59d;--priInk:#06140f}}

.logo{font:800 30px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;color:var(--ink);position:relative;padding-bottom:10px}

<script>
/* ===== Firebase adapter: แทนที่ระบบ claude.ai เดิม (claude.use("db"/"user")) ===== */
firebase.initializeApp({

const fAuth=firebase.auth(),fDb=firebase.firestore();
const authReady=new Promise(r=>{const off=fAuth.onAuthStateChanged(u=>{off();r(u)})});
function ezLogin(){fAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(()=>location.reload()).catch(e=>alert("เข้าสู่ระบบไม่สำเร็จ: "+(e.code||e.message)))}

window.claude={use:async n=>{
  if(n==="db")return fDb;
  if(n==="user")return{
    id:async()=>{const u=await authReady;return u?u.uid:null},

<script>
const FEE_SELL=0.10,FEE_TOP=0.03,BASE=location.origin+location.pathname;
const CATS={"ออกแบบ":["🎨","#ffd9e2"],"โปรแกรมมิ่ง":["💻","#d6e6ff"],"วิดีโอ/เสียง":["🎬","#e5dcff"],"การตลาด":["📣","#ffeab0"],"เขียน/แปล":["✍️","#cdf5e8"],"ที่ปรึกษา":["💡","#ffe0c7"]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const baht=n=>"฿"+(Math.round(n*100)/100).toLocaleString("th-TH");
let db,user,myId,myName0="",P={},S=[],W={bal:0},ob=[],os=[],ta=[],tb=[],M=[],unsub=null,opened=0;
let view="home",cat="ทั้งหมด",q="",chatOpen=false,chatWith=null;
const pname=id=>(P[id]&&P[id].name)||(id===myId&&myName0)||"ผู้ใช้ "+String(id).slice(-4);
const pav=(id,c="")=>{const p=P[id];return p&&p.avatar?`<span class="av ${c}" style="background-image:url(${p.avatar})"></span>`:`<span class="av ${c}">${esc(pname(id)[0]||"?")}</span>`};
const orders=()=>[...ob,...os].filter((o,i,a)=>a.findIndex(x=>x.id===o.id)===i).sort((a,b)=>b.ts-a.ts);
const threads=()=>[...ta,...tb].filter((o,i,a)=>a.findIndex(x=>x.id===o.id)===i).sort((a,b)=>b.ts-a.ts);
const pair=o=>[myId,o].sort().join("_").replace(/[^\w]/g,"");
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function modal(h){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="md">${h}</div>`;o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);return o}
const closeM=()=>document.querySelectorAll(".ov").forEach(o=>o.remove());
const go=v=>{view=v;render()};
function pick(max,cb){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(f)};i.click()}
async function boot(){
  try{user=await claude.use("user");db=await claude.use("db")}catch(e){}
  if(db&&user){myId=await user.id();if(myId){myName0=(await user.me()).name||""}}
  if(!db||!myId){render();return}
  const col=n=>db.collection(n);
  col("profiles").onSnapshot(s=>{P={};s.docs.forEach(d=>P[d.id]=d.data());render()});
  col("services").onSnapshot(s=>{S=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);render();const h=location.hash.slice(1);if(h&&!opened&&S.find(x=>x.id===h)){opened=1;detail(h)}});
  db.doc("wallets/"+myId).onSnapshot(s=>{W=s.exists?s.data():{bal:0};render()});

  if(pl=="free"&&new Date(m.last||0).toDateString()==new Date().toDateString())return"แพลนฟรีลงได้วันละ 1 งาน พรุ่งนี้ค่อยลงใหม่ หรืออัปเกรดแพลน";return""}
const newSvc0=newSvc;newSvc=()=>{const g=canPost();if(g){toast(g);return}newSvc0()};
function shopHead(){const pl=cur(myId),d=(MS[myId]||{}).deco||{},c=d.color||"var(--pri)",pro=pl=="pro";
  return `<div class="panel" style="padding:0;overflow:hidden;${pro?"border-color:"+c:""}">${pro?`<div style="height:120px;background:${d.cover?`url(${d.cover}) center/cover`:c}"></div>`:""}<div class="row" style="padding:14px 18px"><div class="sp"><b>${esc(pname(myId))}</b><div class="mut">${esc(pro&&d.tag?d.tag:"แพลน"+PLANS[pl].n)}${pl!="free"?" · ถึง "+dt(MS[myId].until):""}</div></div>${pro?`<button class="btn out" onclick="deco()">ตกแต่งร้าน</button>`:""}<button class="btn" onclick="go('plans')">${pro?"ต่ออายุ":"อัปเกรด"}</button></div></div>`}
function deco(){const d={...((MS[myId]||{}).deco||{})};const o=modal(`<h2>ตกแต่งร้าน</h2>${imgM(d.cover)}${fld("t","ข้อความใต้ชื่อร้าน",d.tag||"")}<label>สีประจำร้าน</label><input id="c" type="color" value="${d.color||"#0e6b5c"}" style="height:44px">${sv}`);imgB(o,1000,u=>d.cover=u);
  o.querySelector("#ok").onclick=async()=>{d.tag=gv(o,"t");d.color=gv(o,"c");await db.doc("members/"+myId).set({...(MS[myId]||{}),deco:d});closeM();toast("บันทึกแล้ว")}}
function plansV(){const pl=cur(myId),rows={free:["ลงขายได้วันละ 1 งาน","งานโชว์ 3 ชั่วโมง หมดเวลาแล้วหายไปจากตลาด"],mid:["ลงพร้อมกันได้ 5 งาน","แต่ละงานโชว์ 10 วัน"],pro:["ลงได้ไม่จำกัด ไม่มีวันหมดอายุ","ตกแต่งร้านได้เพิ่ม: รูปปก สีประจำร้าน ข้อความแนะนำ"]};
  return `<h2 style="margin:14px 0 4px">แพลนสมาชิก</h2><p class="mut" style="margin:0 0 16px">จ่ายจากกระเป๋าเงิน ครั้งละ 30 วัน หมดอายุแล้วกลับเป็นแพลนฟรี</p><div class="plans">${Object.keys(PLANS).map(k=>{const p=PLANS[k],on=pl==k;return `<div class="panel plan ${k=="mid"?"hot":""}"><h3>${p.n}</h3><div class="price">${p.p?baht(p.p)+" / 30 วัน":"ฟรี"}</div><ul>${rows[k].map(x=>`<li>${x}</li>`).join("")}</ul>${on?`<div class="tag">แพลนของคุณ${k!="free"?" ถึง "+dt(MS[myId].until):""}</div>`:""}${k=="free"?"":`<button class="btn ${k=="mid"?"sun":""}" style="width:100%;margin-top:10px" onclick="subscribe('${k}')">${on?"ต่ออายุ":"สมัคร"} ${baht(p.p)}</button>`}</div>`}).join("")}</div>`}
async function subscribe(k){const p=PLANS[k];if((W.bal||0)<p.p){modal(`<h2>เงินในกระเป๋าไม่พอ</h2><p>แพลน${p.n} ${baht(p.p)} ตอนนี้มี ${baht(W.bal||0)}</p><button class="btn sun" onclick="closeM();topup()">เติมเงิน</button>`);return}
  const m=MS[myId]||{},base=cur(myId)==k?m.until:Date.now();
  await db.doc("wallets/"+myId).set({bal:Math.round(((W.bal||0)-p.p)*100)/100});await db.doc("members/"+myId).set({...m,plan:k,until:base+30*864e5});toast("สมัครแพลน"+p.n+"แล้ว")}
setInterval(()=>{const a=document.activeElement;if(myId&&!document.querySelector(".ov")&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()},30000);
boot();
</script>
